<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谷歌识图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            color: #999;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
        }

        #fileInput {
            display: none;
        }

        .preview-area {
            display: none;
            margin-top: 20px;
        }

        .preview-area.show {
            display: block;
        }

        .preview-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-search:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-clear {
            background: #f5f5f5;
            color: #666;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .tips {
            margin-top: 25px;
            padding: 15px 20px;
            background: #f8f9ff;
            border-radius: 8px;
            text-align: left;
        }

        .tips-icon {
            color: #667eea;
            margin-right: 8px;
        }

        .tips-text {
            color: #666;
            font-size: 13px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔍</div>
        <h1>谷歌识图</h1>
        <p class="subtitle">上传图片，搜索图片来源与相似图片</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <div class="upload-text">点击或拖拽上传图片</div>
            <div class="upload-hint">支持 JPG、PNG、WEBP 等格式</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="preview-area" id="previewArea">
            <img id="previewImage" class="preview-image" src="" alt="预览">
            <div class="actions">
                <button class="btn btn-clear" id="clearBtn">重新选择</button>
                <button class="btn btn-search" id="searchBtn">
                    <span id="searchBtnText">搜索图片</span>
                </button>
            </div>
        </div>

        <div class="tips">
            <span class="tips-icon">💡</span>
            <span class="tips-text">提示：谷歌识图可以帮助您查找图片来源、相似图片以及相关信息。上传的图片会先上传到临时图床获取公开链接，再通过 Google Lens 进行搜索。</span>
        </div>

        <div class="footer">
            Powered by Google Lens
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const previewImage = document.getElementById('previewImage');
        const searchBtn = document.getElementById('searchBtn');
        const searchBtnText = document.getElementById('searchBtnText');
        const clearBtn = document.getElementById('clearBtn');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                uploadArea.style.display = 'none';
                previewArea.classList.add('show');
            };
            reader.readAsDataURL(file);
        }

        clearBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            previewImage.src = '';
            previewArea.classList.remove('show');
            uploadArea.style.display = 'flex';
            uploadArea.style.flexDirection = 'column';
            uploadArea.style.alignItems = 'center';
        });

        searchBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            searchBtn.disabled = true;
            searchBtnText.innerHTML = '<span class="loading"></span> 上传图片中...';

            try {
                const imageUrl = await uploadImage(selectedFile);
                const googleLensUrl = 'https://lens.google.com/uploadbyurl?url=' + encodeURIComponent(imageUrl);
                window.open(googleLensUrl, '_blank');
            } catch (error) {
                console.error(error);
                alert('搜索失败：' + (error.message || '请检查网络连接，或尝试更换网络环境'));
            } finally {
                searchBtn.disabled = false;
                searchBtnText.textContent = '搜索图片';
            }
        });

        async function uploadImage(file) {
            let lastError = null;

            // 方案1：Telegraph 图床
            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch('https://telegra.ph/upload', {
                    method: 'POST',
                    body: formData,
                });

                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data[0] && data[0].src) {
                        return 'https://telegra.ph' + data[0].src;
                    }
                }
            } catch (error) {
                lastError = error;
            }

            // 方案2：0x0.st 图床
            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch('https://0x0.st', {
                    method: 'POST',
                    body: formData,
                });

                if (response.ok) {
                    const text = (await response.text()).trim();
                    if (text && text.startsWith('http')) {
                        return text;
                    }
                }
            } catch (error) {
                lastError = error;
            }

            throw lastError || new Error('图片上传失败，请检查网络连接');
        }
    </script>
</body>
</html>
