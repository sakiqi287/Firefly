# Cloudflare Workers 配置 - 用于部署静态网站
name = "huiyu"
main = "./worker/index.ts"
compatibility_date = "2025-01-01"
node_compat = true

# 静态资源配置
[assets]
directory = "./dist"

# 浏览量计数器 KV 绑定
[[kv_namespaces]]
binding = "PAGE_VIEWS"
id = "a7ef8b83f20f4c6f86a9c6d41d3d5e9c"
preview_id = ""

[vars]
NODE_VERSION = "22"
